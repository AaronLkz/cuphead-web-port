name: Build and Deploy Cuphead WebGL to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build WebGL in Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Build WebGL Target
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 2021.3.11f1
          buildMethod: BuildWebGL.PerformBuild
          buildsPath: build
          customParameters: -logFile /github/workspace/unity-build.log

      - name: Print Unity Log Summary
        if: always()
        run: |
          echo "=========================================================="
          echo "CHECKING UNITY BUILD LOG"
          echo "=========================================================="
          if [ -f unity-build.log ]; then
            echo "--- ERRORS / WARNINGS / COMPILER MESSAGES ---"
            grep -E "(error CS|Compilation failed|Exception|Build FAILED|Build SUCCEEDED)" unity-build.log | head -n 100 || true
            echo "--- LAST 100 LINES OF UNITY BUILD LOG ---"
            tail -n 100 unity-build.log
          else
            echo "unity-build.log not found in workspace."
          fi

      - name: Upload Unity Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-log
          path: unity-build.log

      - name: Upload WebGL Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cuphead-Isla1-WebGL
          path: build/WebGL

      - name: Package for GitHub Pages
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  diagnose:
    name: Diagnose Build Errors
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and display error log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== DOWNLOADING FAILED LOG VIA GH CLI ==="
          gh run view ${{ github.run_id }} --repo ${{ github.repository }} --log-failed > failed_log.txt || true
          echo "=== SEARCHING COMPILER ERRORS ==="
          grep -E "(error CS|Scripts have compiler errors|Exception|Aborting)" failed_log.txt | head -n 50 || true
          echo "=== LAST 100 LINES OF FAILED STEP ==="
          tail -n 100 failed_log.txt
