<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #0c0c0e;
        color: #f3efe6;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 56.25vw; /* 16:9 aspect ratio */
        background: #000;
        box-shadow: 0 0 30px rgba(0,0,0,0.9);
      }
      @media (min-aspect-ratio: 16/9) {
        #unity-canvas {
          max-height: 100vh;
          max-width: 177.78vh; /* 16:9 aspect ratio */
        }
      }
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #111114;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: opacity 0.5s ease;
      }
      .title {
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 4px;
        margin-bottom: 24px;
        text-transform: uppercase;
        color: #f7d070;
        text-shadow: 2px 2px 0px #000;
      }
      .progress-container {
        width: 320px;
        height: 14px;
        border: 2px solid #f7d070;
        border-radius: 8px;
        overflow: hidden;
        background: #222;
        box-shadow: 0 0 10px rgba(247, 208, 112, 0.3);
      }
      .progress-fill {
        width: 0%;
        height: 100%;
        background: #f7d070;
        transition: width 0.1s linear;
      }
      .loading-status {
        margin-top: 14px;
        font-size: 13px;
        color: #bbb;
        letter-spacing: 1px;
      }
      #warning-banner {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 13px;
        display: none;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="loading-overlay">
        <div class="title">Cuphead - Isla 1</div>
        <div class="progress-container">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="loading-status" class="loading-status">Cargando juego... (0%)</div>
      </div>
      <div id="warning-banner"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingOverlay = document.querySelector("#loading-overlay");
      var progressFill = document.querySelector("#progress-fill");
      var loadingStatus = document.querySelector("#loading-status");
      var warningBanner = document.querySelector("#warning-banner");

      function showBanner(msg, type) {
        warningBanner.innerHTML = msg;
        warningBanner.style.display = "block";
        if (type === "error") {
          warningBanner.style.background = "#e74c3c";
          warningBanner.style.color = "#fff";
        } else {
          warningBanner.style.background = "#f1c40f";
          warningBanner.style.color = "#000";
          setTimeout(function() { warningBanner.style.display = "none"; }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if HAS_CODE_FILENAME
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: showBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var pct = Math.round(100 * progress);
          progressFill.style.width = pct + "%";
          loadingStatus.innerText = "Cargando juego... (" + pct + "%)";
        }).then((unityInstance) => {
          loadingOverlay.style.opacity = "0";
          setTimeout(function() {
            loadingOverlay.style.display = "none";
          }, 500);
        }).catch((message) => {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
